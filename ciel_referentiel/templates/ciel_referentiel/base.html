<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CIEL Référentiel{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-900">
    <!-- Navigation Header -->
    <header class="border-b border-gray-200 bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <nav class="flex items-center justify-between">
                <h1 class="text-2xl font-semibold text-gray-900">
                    <a href="/" class="hover:text-gray-600 transition-colors">CIEL Référentiel</a>
                </h1>
                <div class="flex gap-4 items-center">
                    <a href="/" class="text-gray-600 hover:text-gray-900 transition-colors font-medium">
                        Accueil
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200 bg-gray-50 mt-12">
        <div class="max-w-7xl mx-auto px-6 py-6 text-center text-gray-500 text-sm">
            <p>Référentiel pédagogique CIEL - Bac Pro CIEL</p>
        </div>
    </footer>
</body>
</html>
